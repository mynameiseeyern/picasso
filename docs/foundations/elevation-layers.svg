<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-labelledby="t">
  <title id="t">The six Picasso layers, from the page at 0 up to notification at 3200</title>
  <style>
    :root {
      --ink: #121926; --mute: #4B5565; --num: #697586;
      --line: #CDD5DF; --fill: #EEF2F6; --accent: #007FAB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #F8FAFC; --mute: #9AA4B2; --num: #697586;
        --line: #364152; --fill: #202939; --accent: #1A92C1;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: var(--num); }
    .name { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .who { font-size: 13px; fill: var(--mute); }
    .axis { font-size: 11px; letter-spacing: .08em; fill: var(--num); }
    .slab { fill: var(--fill); stroke: var(--line); }
    .ghost { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
  </style>

  <g stroke="var(--line)" fill="none" stroke-width="1.25">
    <path d="M16 362 L16 30"/>
    <path d="M11 36 L16 26 L21 36"/>
  </g>
  <text class="axis" x="30" y="24">ABOVE</text>

  <g>
    <text class="n" x="120" y="44" text-anchor="end">3200</text>
    <rect class="slab" x="134" y="18" width="592" height="38" rx="7"/>
    <rect x="134" y="18" width="3" height="38" rx="1.5" fill="var(--accent)"/>
    <text class="name" x="152" y="42">notification</text>
    <text class="who" x="300" y="42">Toast</text>
  </g>
  <g>
    <text class="n" x="120" y="104" text-anchor="end">2000</text>
    <rect class="slab" x="134" y="78" width="592" height="38" rx="7"/>
    <rect x="134" y="78" width="3" height="38" rx="1.5" fill="var(--accent)"/>
    <text class="name" x="152" y="102">floating</text>
    <text class="who" x="300" y="102">Tooltip · Popover · Select · DropdownMenu</text>
  </g>
  <g>
    <text class="n" x="120" y="164" text-anchor="end">1600</text>
    <rect class="slab" x="134" y="138" width="592" height="38" rx="7"/>
    <rect x="134" y="138" width="3" height="38" rx="1.5" fill="var(--accent)"/>
    <text class="name" x="152" y="162">modal</text>
    <text class="who" x="300" y="162">Dialog · Drawer</text>
  </g>
  <g>
    <text class="n" x="120" y="224" text-anchor="end">800</text>
    <rect class="slab" x="134" y="198" width="592" height="38" rx="7"/>
    <rect x="134" y="198" width="3" height="38" rx="1.5" fill="var(--accent)"/>
    <text class="name" x="152" y="222">overlay</text>
    <text class="who" x="300" y="222">The scrim</text>
  </g>
  <g>
    <text class="n" x="120" y="284" text-anchor="end">100</text>
    <rect class="slab" x="134" y="258" width="592" height="38" rx="7"/>
    <rect x="134" y="258" width="3" height="38" rx="1.5" fill="var(--accent)"/>
    <text class="name" x="152" y="282">raised</text>
    <text class="who" x="300" y="282">The active OTP slot · a ButtonGroup member on hover</text>
  </g>
  <g>
    <text class="n" x="120" y="344" text-anchor="end">0</text>
    <rect class="ghost" x="134" y="318" width="592" height="38" rx="7"/>
    <text class="name" x="152" y="342">base</text>
    <text class="who" x="300" y="342">The page</text>
  </g>
</svg>
